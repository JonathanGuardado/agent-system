repo:
  name: ofertas-sv
  root: ~/repos/ofertas-sv
  default_branch: main

language:
  primary: typescript
  package_manager: npm

commands:
  # Structured argv only. A `bash -lc` wrapper can compute its own target at
  # runtime, which makes the trust root unresolvable -- and the guards these
  # replaced exited 0 when package.json was absent, so every gate passed
  # vacuously on a repository with no application in it.
  install:
    command: ["npm", "ci", "--no-audit", "--no-fund", "--ignore-scripts"]
    timeout_seconds: 300
    working_directory: "."
  test:
    command: ["npm", "run", "test"]
    timeout_seconds: 180
    working_directory: "."
  lint:
    command: ["npm", "run", "lint"]
    timeout_seconds: 180
    working_directory: "."
  typecheck:
    command: ["npx", "--no-install", "tsc", "--noEmit"]
    timeout_seconds: 180
    working_directory: "."
  build:
    command: ["npm", "run", "build"]
    timeout_seconds: 300
    working_directory: "."

gates:
  test: required
  typecheck: required
  lint: optional
  build: optional

trust_root:
  # Only the keys that decide what verification runs -- the rest of
  # package.json is ordinary application data.
  - kind: json_pointer
    path: package.json
    pointers: ["/scripts", "/devDependencies"]
  - kind: file
    path: package-lock.json
  - kind: file
    path: tsconfig.json
  - kind: file
    path: vitest.config.ts
  - kind: tree
    path: .github/
  - kind: file
    path: CODEOWNERS
  # Whatever the trusted commands actually resolve to, computed at load.
  - kind: derived
    source: verification_commands

policy:
  dependency_install_allowed: true
  config_paths_allowed:
    - .gitignore
    - .env.example
    - README.md
    - index.html
    - i18n.ts
    - package.json
    - package-lock.json
    - tsconfig.json
    - next-env.d.ts
    - next.config.js
    - next.config.mjs
    - next.config.ts
    - middleware.ts
    - proxy.ts
    - postcss.config.js
    - postcss.config.mjs
    - tailwind.config.js
    - tailwind.config.mjs
    - tailwind.config.ts
    - vite.config.js
    - vite.config.mjs
    - vite.config.ts
    - eslint.config.js
    - eslint.config.mjs
    - eslint.config.ts
    - vitest.config.ts
    - vitest.setup.ts
    - playwright.config.ts
    - public/
  protected_paths:
    - .github/
    - Dockerfile
    - docker-compose.yml
    - docker-compose.yaml
    - .env
    - secrets/
    - ~/config/

source_dirs:
  - app/
  - components/
  - data/
  - i18n/
  - lib/
  - locales/
  - messages/
  - pages/
  - public/
  - src/
  - styles/
  - supabase/
  - types/

test_dirs:
  - __tests__/
  - tests/
