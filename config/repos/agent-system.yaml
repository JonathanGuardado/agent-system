repo:
  name: agent-system
  root: ~/repos/agent-system
  default_branch: main

language:
  primary: python
  package_manager: setuptools

commands:
  test:
    command: ["python", "-m", "pytest", "tests/", "-x", "-q"]
    timeout_seconds: 120
    working_directory: "."
    writable_paths: [".pytest_cache"]
    network: none
  lint:
    command: ["python", "-m", "ruff", "check", "src/"]
    timeout_seconds: 60
    working_directory: "."
    writable_paths: [".ruff_cache"]
    network: none
  install: null

policy:
  dependency_install_allowed: false
  config_paths_allowed:
    - config/repos/
  protected_paths:
    - .github/
    - Dockerfile
    - docker-compose.yml
    - docker-compose.yaml
    - .env
    - secrets/
    - ~/config/

source_dirs:
  - src/

test_dirs:
  - tests/

gates:
  test: required
  lint: optional

# typecheck and build are intentionally absent: this is a Python package with
# no build step and no type checker configured. Declaring an empty gate to
# have a gate is worse than declaring none -- it would report `passed` for
# work nobody did.

trust_root:
  - kind: tree
    path: config/repos/
  - kind: tree
    path: config/policy/
  - kind: tree
    path: .github/
  - kind: file
    path: pyproject.toml
  - kind: derived
    source: verification_commands
