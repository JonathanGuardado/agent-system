[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-agent"
version = "0.1.0"
description = "Slack-first, Jira-backed agent execution system."
requires-python = ">=3.12"
dependencies = [
  "ai-model-selector @ git+https://github.com/JonathanGuardado/ai-model-selector.git@c9ab8e3c03d44d7e22833c9a7721a7d374379935",
  "httpx>=0.27.0",
  "langgraph>=1.0.0,<2.0.0",
  "pydantic>=2.7.4",
  "PyYAML>=6.0.1",
  "slack_sdk>=3.27.0",
]

[project.scripts]
ticket-agent = "ticket_agent.app:run"
ticket-agent-smoke-e2e = "ticket_agent.e2e_smoke:main"
ticket-agent-smoke-model-router = "ticket_agent.router.smoke:main"
ticket-agent-smoke-runtime = "ticket_agent.runtime_smoke:main"

[project.optional-dependencies]
dev = [
  "mypy>=2.3",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit, so the enforced set never drifts with a ruff upgrade.
#
# `S` (bandit) is selected deliberately despite the noise: this codebase's job
# is running other people's commands, so the security rules that survive the
# ignores below are the ones worth failing CI over. `PL` is limited to errors
# and warnings -- its convention and refactor rules are opinions about shape,
# and mechanical churn across 28k lines would obscure the safety work this
# milestone is actually about.
select = [
  "F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF",
  "BLE", "TRY", "PYI", "ISC", "FLY", "FURB",
  "S", "PLE", "PLW",
]
ignore = [
  "E501",     # line length is formatter territory, not a lint failure
  "TRY003",   # long messages inline are how policy denials stay readable
  "S404",     # subprocess import is the point of the shell adapter
  "S603",     # every subprocess call here is allowlisted before it runs
  "S607",     # partial paths come from repo contracts, not user input
  "S108",     # /tmp paths in fixtures and sandbox mount defaults
  "ISC003",   # explicit concatenation is clearer in long policy messages
  "ISC004",   # wrapped long prompt/message strings in list literals are intentional
]

[tool.ruff.lint.per-file-ignores]
# Test tokens are literals by construction, and asserts are the point.
"tests/**" = ["S101", "S105", "S106", "BLE001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
